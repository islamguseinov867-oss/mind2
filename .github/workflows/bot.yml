name: Run Telegram Bot

# Запускает бота на серверах GitHub.
# Один прогон работает до 6 часов, затем перезапускается по расписанию.
on:
  workflow_dispatch:        # Кнопка "Run workflow" вручную
  schedule:
    - cron: "0 */5 * * *"   # Каждые 5 часов — перезапуск

# Только один бот может слушать Telegram одновременно.
# Новый запуск автоматически заменяет старый (новейший побеждает).
concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # ~5 ч 50 мин, затем job завершится сам
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
