services:
  - type: worker
    name: mind2-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MOTIVATION_HOUR
        value: "7"
      - key: MOTIVATION_MINUTE
        value: "0"
